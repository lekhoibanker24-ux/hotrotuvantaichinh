<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b63ce">
<title>Máy Tính Khoản Vay - Giàu</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f6fa;color:#172033}
.container{max-width:900px;margin:auto;padding:16px}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 4px 18px rgba(0,0,0,.07)}
h1{font-size:23px;text-align:center;margin:4px 0 6px;color:#0b63ce}
.sub{text-align:center;color:#667085;font-size:14px;margin-bottom:18px}
label{display:block;font-weight:600;margin:12px 0 6px}
input,select,button{width:100%;min-height:46px;border:1px solid #d0d5dd;border-radius:10px;padding:10px 12px;font-size:16px}
input:focus,select:focus{outline:2px solid #b7d5ff;border-color:#0b63ce}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{border:0;background:#0b63ce;color:#fff;font-weight:700;cursor:pointer;margin-top:16px}
button.secondary{background:#eef4fb;color:#0b63ce}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.box{background:#f7f9fc;border-radius:12px;padding:12px;text-align:center}
.box span{display:block;color:#667085;font-size:13px;margin-bottom:5px}
.box strong{font-size:17px;color:#0b63ce}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:700px}
th,td{padding:9px 7px;border-bottom:1px solid #eaecf0;text-align:right}
th{background:#f2f4f7;text-align:center;white-space:nowrap}
td:first-child,th:first-child{text-align:center}
.note{font-size:12px;color:#667085;line-height:1.5;margin-top:10px}
.hidden{display:none}
@media(max-width:600px){
 .container{padding:10px}.card{padding:14px;border-radius:13px}
 .grid{grid-template-columns:1fr}
 .summary{grid-template-columns:1fr}
 h1{font-size:21px}
}
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>💰 MÁY TÍNH KHOẢN VAY</h1>
    <div class="sub">Tính nhanh khoản trả nợ hàng tháng</div>

    <div class="grid">
      <div>
        <label>Số tiền vay (VNĐ)</label>
        <input id="principal" inputmode="numeric" value="500000000" placeholder="Ví dụ: 500.000.000">
      </div>
      <div>
        <label>Thời hạn vay (tháng)</label>
        <input id="months" type="number" min="1" value="60">
      </div>
    </div>

    <div class="grid">
      <div>
        <label>Lãi suất</label>
        <input id="rate" inputmode="decimal" value="7.2" placeholder="Ví dụ: 7,2">
      </div>
      <div>
        <label>Đơn vị lãi suất</label>
        <select id="rateUnit">
          <option value="year">% / năm</option>
          <option value="month">% / tháng</option>
        </select>
      </div>
    </div>

    <label>Phương thức trả nợ</label>
    <select id="method">
      <option value="equal">Trả góp đều (gốc + lãi hàng tháng)</option>
      <option value="principal">Gốc cố định, lãi giảm dần</option>
    </select>

    <button onclick="calculate()">TÍNH KHOẢN VAY</button>
    <button class="secondary" onclick="resetForm()">XÓA & NHẬP LẠI</button>

    <div class="note">
      * Công cụ mang tính tham khảo. Kết quả thực tế có thể khác do ngày giải ngân,
      ngày thu nợ, cách tính lãi và quy định của từng ngân hàng.
    </div>
  </div>

  <div id="result" class="hidden">
    <div class="card">
      <div class="summary">
        <div class="box"><span>Trả kỳ đầu</span><strong id="firstPayment">-</strong></div>
        <div class="box"><span>Tổng tiền lãi</span><strong id="totalInterest">-</strong></div>
        <div class="box"><span>Tổng phải trả</span><strong id="totalPayment">-</strong></div>
      </div>
    </div>

    <div class="card">
      <h3>Lịch trả nợ</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Kỳ</th>
              <th>Dư nợ đầu kỳ</th>
              <th>Gốc</th>
              <th>Lãi</th>
              <th>Phải trả</th>
              <th>Dư nợ cuối kỳ</th>
            </tr>
          </thead>
          <tbody id="schedule"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
function numberValue(id){
  const raw=document.getElementById(id).value.replace(/[^\d]/g,'');
  return Number(raw)||0;
}
function decimalValue(id){
  const raw=document.getElementById(id).value.replace(',','.');
  return Number(raw)||0;
}
function money(n){
  return Math.round(n).toLocaleString('vi-VN') + ' đ';
}
function calculate(){
  const P=numberValue('principal');
  const n=parseInt(document.getElementById('months').value)||0;
  const rate=decimalValue('rate');
  const unit=document.getElementById('rateUnit').value;
  const method=document.getElementById('method').value;

  if(P<=0 || n<=0 || rate<0){
    alert('Vui lòng nhập đầy đủ thông tin hợp lệ.');
    return;
  }

  const r=unit==='year' ? rate/100/12 : rate/100;
  let balance=P, totalInterest=0, totalPayment=0, rows='';
  let fixedPrincipal=P/n;

  for(let i=1;i<=n;i++){
    const interest=balance*r;
    let principal, payment;
    if(method==='equal'){
      if(r===0){
        payment=P/n;
      }else{
        payment=P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
      }
      principal=payment-interest;
      if(i===n) principal=balance;
      payment=principal+interest;
    }else{
      principal=(i===n)?balance:fixedPrincipal;
      payment=principal+interest;
    }
    const begin=balance;
    balance=Math.max(0,balance-principal);
    totalInterest+=interest;
    totalPayment+=payment;

    rows += `<tr>
      <td>${i}</td>
      <td>${money(begin)}</td>
      <td>${money(principal)}</td>
      <td>${money(interest)}</td>
      <td><b>${money(payment)}</b></td>
      <td>${money(balance)}</td>
    </tr>`;
  }

  const firstRow=document.createElement('tbody');
  document.getElementById('schedule').innerHTML=rows;
  const first=document.querySelector('#schedule tr td:nth-child(5)')?.textContent || '-';
  document.getElementById('firstPayment').textContent=first;
  document.getElementById('totalInterest').textContent=money(totalInterest);
  document.getElementById('totalPayment').textContent=money(totalPayment);
  document.getElementById('result').classList.remove('hidden');
  document.getElementById('result').scrollIntoView({behavior:'smooth'});
}
function resetForm(){
  document.getElementById('principal').value='';
  document.getElementById('months').value='60';
  document.getElementById('rate').value='';
  document.getElementById('rateUnit').value='year';
  document.getElementById('method').value='equal';
  document.getElementById('result').classList.add('hidden');
}
document.getElementById('principal').addEventListener('input',function(){
  const n=numberValue('principal');
  if(n) this.value=n.toLocaleString('vi-VN');
});
</script>
</body>
</html>
